# =============================================================================
# Yocto Project — local.conf
# Target: Intel Galileo Gen 2 (Quark X1000)
# Yocto Version: Dunfell 3.1.33
# =============================================================================

# Máquina alvo
MACHINE ?= "intel-galileo-gen2"

# Diretórios de cache (fora da pasta build para reutilização)
DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

# Paralelismo de build — ajuste para a quantidade de núcleos disponíveis
BB_NUMBER_THREADS ?= "$(nproc)"
PARALLEL_MAKE ?= "-j $(nproc)"

# Formato de imagem: .hddimg para gravar no SD Card com dd ou BalenaEtcher
IMAGE_FSTYPES += "hddimg"

# ─── Pacotes instalados na imagem ─────────────────────────────────────────────
CORE_IMAGE_EXTRA_INSTALL += "\
    nano \
    curl \
    wget \
    git \
    python3 \
    python3-pip \
    i2c-tools \
    python3-smbus2 \
    paho-mqtt-c \
    paho-mqtt-cpp \
    openssl \
"

# ─── Features da imagem ───────────────────────────────────────────────────────
# tools-debug: gdb, strace
# ssh-server-openssh: acesso remoto via SSH
# tools-sdk: gcc, g++, make, headers do kernel (permite compilar na placa)
EXTRA_IMAGE_FEATURES += "\
    tools-debug \
    ssh-server-openssh \
    tools-sdk \
"

# ─── Configuração de usuários ─────────────────────────────────────────────────
# Usuário principal com sudo
inherit extrausers
EXTRA_USERS_PARAMS = "\
    useradd -m -s /bin/bash jao; \
    usermod -aG sudo jao; \
    echo 'jao:galileo123' | chpasswd; \
    echo 'root:root123' | chpasswd; \
"

# ─── Configurações de rede ────────────────────────────────────────────────────
# DHCP habilitado por padrão — IP estático pode ser configurado após boot
PACKAGECONFIG:append:pn-connman = " ethernet"

# ─── Otimizações para hardware embarcado ─────────────────────────────────────
# Sem interface gráfica — sistema apenas CLI
# Remove pacotes de debug pesados desnecessários em produção
INHIBIT_DEFAULT_DEPS = ""

# Distro base
DISTRO ?= "poky"

# Pacote manager (para instalar pacotes pós-boot via opkg)
PACKAGE_CLASSES ?= "package_ipk"

# Aceitar licenças de software livre
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
