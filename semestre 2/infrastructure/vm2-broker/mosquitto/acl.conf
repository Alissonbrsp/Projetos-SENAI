# =============================================================================
# Mosquitto ACL — Controle de Acesso por Tópico
# ⚠️  ATENÇÃO ADMINISTRADOR: Este arquivo contém uma ACL intencionalmente
#     mal configurada como parte do desafio CTF (Flag 3).
#     A regra do sensor01 deveria ser APENAS 'write', não 'readwrite'.
# =============================================================================

# --- Usuário: mqtt_admin ---
# Administrador tem acesso total
user mqtt_admin
topic readwrite fabrica/#
topic readwrite sistema/#

# --- Usuário: telegraf ---
# Agente de coleta: apenas leitura nos tópicos de dados de sensores
user telegraf
topic read fabrica/#

# --- Usuário: sensor01 ---
# CORRETO seria: topic write fabrica/sensor01/#
# VULNERÁVEL (ACL permissiva — Flag 3): permite leitura de todos os tópicos,
# incluindo fabrica/sistema/flag que apenas mqtt_admin deveria acessar.
user sensor01
topic readwrite fabrica/#
