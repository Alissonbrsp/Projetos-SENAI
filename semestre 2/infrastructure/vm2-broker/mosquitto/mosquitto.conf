# =============================================================================
# Mosquitto MQTT Broker — VM2 Configuração Principal
# =============================================================================

# Listener na porta padrão MQTT
listener 1883
bind_address 0.0.0.0

# Desabilitar acesso anônimo (requer autenticação)
allow_anonymous false

# Arquivo de senhas (gerado via mosquitto_passwd no setup.sh)
password_file /etc/mosquitto/passwd_file

# Controle de acesso por tópico
acl_file /etc/mosquitto/acl.conf

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Limites de conexão
max_connections 50
max_queued_messages 1000
message_size_limit 65536

# Persistência de mensagens retained
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
