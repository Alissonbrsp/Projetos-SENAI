version: "3.8"

# =============================================================================
# VM3 — Arena do CTF (Docker Compose)
# Containers: InfluxDB, Telegraf, Grafana (vulnerável), Vulnerable API
# ⚠️  Configurações intencionalmente vulneráveis — Ambiente de treinamento CTF
# =============================================================================

networks:
  ctf-internal:
    driver: bridge
    internal: true          # sem acesso direto à internet
  ctf-public:
    driver: bridge

volumes:
  influxdb_data:
  grafana_data:

services:

  # ---------------------------------------------------------------------------
  # InfluxDB 1.8 — banco de séries temporais dos sensores
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8
    container_name: ctf_influxdb
    restart: unless-stopped
    networks:
      - ctf-internal
    environment:
      INFLUXDB_DB: ctf_sensors
      INFLUXDB_ADMIN_USER: influx_admin
      INFLUXDB_ADMIN_PASSWORD: 1nflux_S3cur3_P4ss!
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Telegraf — coleta do Mosquitto e grava no InfluxDB
  # ---------------------------------------------------------------------------
  telegraf:
    image: telegraf:latest
    container_name: ctf_telegraf
    restart: unless-stopped
    networks:
      - ctf-internal
      - ctf-public
    volumes:
      - /opt/ctf/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Grafana 8.3.0 — versão antiga com CVE-2021-43798 (Flag 4)
  # Executa como root + Docker socket montado (Flag 5)
  # ⚠️  VULNERABILIDADES INTENCIONAIS — Ambiente de treinamento CTF
  # ---------------------------------------------------------------------------
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: ctf_grafana
    restart: unless-stopped
    networks:
      - ctf-internal
      - ctf-public
    ports:
      - "80:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin      # senha padrão não alterada
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - /opt/ctf/grafana/provisioning:/etc/grafana/provisioning
      - /opt/ctf/grafana/flag4.txt:/var/lib/grafana/flag4.txt:ro
      # ⚠️  Docker socket montado — Flag 5 (container escape)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - influxdb
    user: "0"                                # executa como root (misconfiguration)

  # ---------------------------------------------------------------------------
  # Vulnerable API — FastAPI de isca para investigação do jogador
  # ---------------------------------------------------------------------------
  vulnerable-api:
    build:
      context: ./vulnerable-api
      dockerfile: Dockerfile
    container_name: ctf_vulnerable_api
    restart: unless-stopped
    networks:
      - ctf-internal
      - ctf-public
    ports:
      - "5000:5000"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_DB: ctf_sensors
      API_VERSION: "1.0.0"
