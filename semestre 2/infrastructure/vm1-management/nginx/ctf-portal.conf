server {
    listen 80;
    server_name _;

    # Logs
    access_log /var/log/nginx/ctf-access.log;
    error_log  /var/log/nginx/ctf-error.log;

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy para o FastAPI (Uvicorn escutando em 127.0.0.1:8000)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health check (para o ALB)
    location /health {
        proxy_pass http://127.0.0.1:8000/api/health;
    }

    # Fallback — redireciona tudo para o CloudFront/S3
    location / {
        return 302 $scheme://$host/api/health;
    }
}
